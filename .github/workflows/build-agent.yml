name: Build Nodexa Agent

# Manual only -- all-arch builds on Azure. BeagleBone agent builds run
# automatically from build-agent-beagle.yml.
on:
  workflow_dispatch:

env:
  AZURE_BUILD_DIR: ~/nodexa-os

jobs:
  build-agent:
    name: Build Nodexa Agent
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Read AGENT_VERSION
      # ---------------------------------------------------------
      - name: Read agent version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < AGENT_VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid AGENT_VERSION: $VERSION"
            echo "Expected format: X.Y.Z"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Agent version: $VERSION"

      # ---------------------------------------------------------
      # 3. Configure SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        env:
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/azure_builder_key
          chmod 600 ~/.ssh/azure_builder_key

          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

          echo "SSH configuration completed"

      # ---------------------------------------------------------
      # 4. Check Azure builder
      # ---------------------------------------------------------
      - name: Check Azure builder
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh \
            -i ~/.ssh/azure_builder_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "echo 'Connected to Azure builder'; \
             uname -m; \
             docker --version"

      # ---------------------------------------------------------
      # Sync Azure builder to this commit
      # ---------------------------------------------------------
      # The builder builds whatever ~/nodexa-os has checked out, so move it
      # to the exact commit this run is for. Plain (non --force) checkout:
      # fails instead of discarding local edits on the builder.
      - name: Sync Azure builder
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh \
            -i ~/.ssh/azure_builder_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "cd $AZURE_BUILD_DIR && \
             git fetch origin ${{ github.sha }} && \
             git checkout --detach ${{ github.sha }} && \
             git log -1 --oneline"

      # ---------------------------------------------------------
      # 5. Build Agent on Azure
      # ---------------------------------------------------------
      # --agent-version, not --version: build-agent.sh treats --version as
      # the OS version (read from VERSION on the builder when omitted).
      - name: Build Nodexa Agent
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ssh \
            -i ~/.ssh/azure_builder_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "cd $AZURE_BUILD_DIR && \
             chmod +x scripts/build-agent.sh && \
             ./scripts/build-agent.sh \
               --arch all \
               --agent-version $VERSION"

      # ---------------------------------------------------------
      # 6. List generated Agent artifacts
      # ---------------------------------------------------------
      - name: List Agent artifacts
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ssh \
            -i ~/.ssh/azure_builder_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "ls -lh $AZURE_BUILD_DIR/build/artifacts/nodexa-agent-$VERSION-*"

      # ---------------------------------------------------------
      # 7. Download OTA tarballs
      # ---------------------------------------------------------
      # Only the OTA upload files (.tar.gz) for this version -- the
      # .sha256/.json side files stay on the builder, and the rest of the
      # build tree is never touched (sstate-cache alone fills the runner).
      - name: Download OTA tarballs
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts

          echo "Downloading OTA tarballs from Azure..."

          rsync -avh --progress \
            -e "ssh -i ~/.ssh/azure_builder_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --include="nodexa-agent-${VERSION}-linux-*.tar.gz" \
            --exclude='*' \
            "$AZURE_USER@$AZURE_HOST:$AZURE_BUILD_DIR/build/artifacts/" \
            artifacts/

      # ---------------------------------------------------------
      # 8. Verify OTA tarballs
      # ---------------------------------------------------------
      # Checksums are read from the builder's .sha256 files (not
      # downloaded into artifacts/) to verify the transfer, then each
      # tarball must hold a ./nodexa-agent ELF for its architecture --
      # what the device's updater (internal/update) requires.
      - name: Verify OTA tarballs
        id: verify
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ssh \
            -i ~/.ssh/azure_builder_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "cat $AZURE_BUILD_DIR/build/artifacts/nodexa-agent-$VERSION-linux-*.tar.gz.sha256" \
            > "$RUNNER_TEMP/builder.sha256"

          declare -A ELF_ARCH=(
            [armv7]='ELF 32-bit LSB executable, ARM'
            [arm64]='ELF 64-bit LSB executable, ARM aarch64'
            [x86_64]='ELF 64-bit LSB executable, x86-64'
          )

          cd artifacts
          ls -lh

          for arch in armv7 arm64 x86_64; do
            f="nodexa-agent-${VERSION}-linux-${arch}.tar.gz"
            [ -f "$f" ] || { echo "ERROR: missing $f"; exit 1; }

            tar -xzOf "$f" ./nodexa-agent > "$RUNNER_TEMP/nodexa-agent"
            file "$RUNNER_TEMP/nodexa-agent" | grep -q "${ELF_ARCH[$arch]}" \
              || { echo "ERROR: $f does not contain a ${arch} nodexa-agent"; exit 1; }
          done

          sha256sum -c "$RUNNER_TEMP/builder.sha256"

          # Stray files would end up in the upload -- only tarballs allowed.
          if find . -type f ! -name '*.tar.gz' | grep -q .; then
            echo "ERROR: unexpected non-tarball files in artifacts/"
            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Upload GitHub artifact
      # ---------------------------------------------------------
      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodexa-agent-${{ steps.version.outputs.version }}
          path: artifacts/*.tar.gz
          compression-level: 0
          retention-days: 90

      # ---------------------------------------------------------
      # 10. Build summary
      # ---------------------------------------------------------
      # SHA256 goes in the summary (needed for pin-agent), not the upload.
      - name: Build summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## Nodexa Agent Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Architecture | all |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### OTA files" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | SHA256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          (cd artifacts && sha256sum *.tar.gz) | while read -r sum file; do
            echo "| \`$file\` | \`$sum\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Build command" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./scripts/build-agent.sh --arch all --agent-version $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
