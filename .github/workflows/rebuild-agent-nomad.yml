name: Rebuild Nodexa Agent - Nodex Nomad

# Manual-only rebuild of the current AGENT_VERSION supervisor for Nodex
# Nomad, for when a build of that version came out broken. Unlike "Build
# Nodexa Agent - Nodex Nomad" there is no check for an existing artifact,
# and the dashboard's copy of the version is deleted and replaced by this
# build (only after the new package is downloaded and verified). Build
# steps are kept identical to build-agent-nomad.yml.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BOARD: x86_64
  # build-agent.sh names GOARCH=amd64 output "x86_64".
  TARGET: linux-x86_64

jobs:
  # ---------------------------------------------------------
  # Always builds: no check for an existing artifact.
  # ---------------------------------------------------------
  check:
    name: Read Agent version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      build: "true"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Agent version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < AGENT_VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid AGENT_VERSION: $VERSION"
            echo "Expected format: X.Y.Z"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Agent version: $VERSION (rebuild, replaces the dashboard's copy)"

  build:
    name: Build Nodex Nomad Agent
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Set up Go
      # ---------------------------------------------------------
      # Static CGO_ENABLED=0 cross-compile -- no Yocto/Azure builder needed.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/nodexa-agent/go.mod
          cache-dependency-path: src/nodexa-agent/go.sum

      # ---------------------------------------------------------
      # 3. Build Agent
      # ---------------------------------------------------------
      # --agent-version is what the device compares against the cloud's
      # pinned version; a mismatch would re-trigger the OTA every heartbeat.
      - name: Build Nodexa Agent
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ./scripts/build-agent.sh \
            --arch "$BOARD" \
            --agent-version "$VERSION"

      # ---------------------------------------------------------
      # 4. Collect and verify OTA tarball
      # ---------------------------------------------------------
      - name: Verify OTA tarball
        id: artifact
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          NAME="nodexa-agent-${VERSION}-${TARGET}"

          # Only the OTA upload file (.tar.gz) goes into the artifact; the
          # .sha256/.json side files stay in build/artifacts.
          mkdir -p artifacts
          cp "build/artifacts/${NAME}.tar.gz" artifacts/

          cd artifacts
          (cd ../build/artifacts && cat "${NAME}.tar.gz.sha256") | sha256sum -c

          # The device's updater extracts ./nodexa-agent and rejects
          # anything that is not an x86-64 ELF (internal/update.verifyELF).
          tar -xzOf "${NAME}.tar.gz" ./nodexa-agent > /tmp/nodexa-agent
          file /tmp/nodexa-agent | tee /dev/stderr | grep -q 'ELF 64-bit LSB executable, x86-64'

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${NAME}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 5. Upload GitHub artifact
      # ---------------------------------------------------------
      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/${{ steps.artifact.outputs.name }}.tar.gz
          compression-level: 0
          retention-days: 90

      # ---------------------------------------------------------
      # 6. Build summary
      # ---------------------------------------------------------
      - name: Build summary
        env:
          VERSION: ${{ needs.check.outputs.version }}
          NAME: ${{ steps.artifact.outputs.name }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          echo "## Nodexa Agent Build - Nodex Nomad" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Board | Nodex Nomad (${TARGET}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | $VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OTA file | \`${NAME}.tar.gz\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA256 | \`$SHA256\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Pin on a device" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "POST /devices/<device_id>/pin-agent" >> "$GITHUB_STEP_SUMMARY"
          echo "{\"version\": \"$VERSION\", \"url\": \"<hosted URL of ${NAME}.tar.gz>\", \"sha256\": \"$SHA256\"}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------
  # Publish to the admin dashboard, replacing this version if it's
  # already there (see publish-nomad.yml's replace input).
  # ---------------------------------------------------------
  publish:
    name: Publish to dashboard
    needs: [check, build]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish-nomad.yml
    with:
      component: supervisor
      version: ${{ needs.check.outputs.version }}
      replace: true
    secrets:
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
