name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'AGENT_VERSION'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if release/tag already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-release:
    name: Check Version & Release Status
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ ! -f AGENT_VERSION ]; then
            echo "Error: AGENT_VERSION file not found"
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < AGENT_VERSION)"
          if [ -z "$VERSION" ]; then
            echo "Error: VERSION file is empty"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "Found version: ${VERSION} (tag: ${TAG})"

          if [ "$FORCE" = "true" ]; then
            echo "Force release requested via workflow_dispatch."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if GitHub release already exists for this tag
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice ::Release ${TAG} already exists on ${{ github.repository }}. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Also check if Git tag already exists on remote
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "::notice ::Tag ${TAG} already exists on remote. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release ${TAG} does not exist yet. Proceeding with release build."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # Clears the build artifacts of earlier runs before this one builds, so
  # only the release being built is ever kept. Nothing is lost: each GitHub
  # release keeps its own copy of every file, and publish-dashboard only
  # uses this run's artifacts.
  cleanup-artifacts:
    name: Delete old build artifacts
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from earlier runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"assets-\")) | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              echo "Deleted artifact ${id}"
            done

  build:
    name: Build (${{ matrix.os }}-${{ matrix.display_arch || matrix.arch }})
    needs: [check-release, cleanup-artifacts]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            goarm: '7'
            display_arch: armv7
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and package binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.check-release.outputs.version }}
          COMMIT: ${{ github.sha }}
          SECRET_CLOUD_URL: ${{ secrets.CLOUD_URL }}
          SECRET_TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          DISPLAY_ARCH="${{ matrix.display_arch || matrix.arch }}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Helper to obfuscate secrets using XOR mask so they are not plain text in the binary
          encode_secret() {
            local val="$1"
            if [ -z "$val" ]; then
              echo ""
              return
            fi
            python3 -c "import sys, base64; raw = bytearray(sys.argv[1].encode('utf-8')); sys.stdout.write('enc:' + base64.b64encode(bytes([b ^ 0x5a for b in raw])).decode('utf-8'))" "$val"
          }

          ENC_CLOUD_URL="$(encode_secret "${SECRET_CLOUD_URL}")"
          ENC_TS_KEY="$(encode_secret "${SECRET_TAILSCALE_AUTHKEY}")"

          LDFLAGS="-s -w \
            -X github.com/nodexa/nodexa-os/nodexa-agent/internal/version.AgentVersion=${VERSION} \
            -X github.com/nodexa/nodexa-os/nodexa-agent/internal/version.OSVersion=${VERSION} \
            -X github.com/nodexa/nodexa-os/nodexa-agent/internal/version.Commit=${COMMIT:0:12} \
            -X github.com/nodexa/nodexa-os/nodexa-agent/internal/version.BuildDate=${BUILD_DATE} \
            -X github.com/nodexa/nodexa-os/nodexa-agent/internal/version.DefaultCloudURL=${ENC_CLOUD_URL} \
            -X github.com/nodexa/nodexa-os/nodexa-agent/internal/version.DefaultTailscaleAuthKey=${ENC_TS_KEY}"

          BIN_NAME="nodex-supervisor${{ matrix.ext }}"
          ALIAS_NAME="nodexa-agent${{ matrix.ext }}"

          STAGE_DIR="stage-${{ matrix.os }}-${DISPLAY_ARCH}"
          mkdir -p "${STAGE_DIR}"

          go build -trimpath -ldflags "${LDFLAGS}" -o "${STAGE_DIR}/${BIN_NAME}" ./cmd/nodexa-agent
          cp "${STAGE_DIR}/${BIN_NAME}" "${STAGE_DIR}/${ALIAS_NAME}"
          # Local CLI (nodexactl ps/logs/exec ...) for the host's own shell.
          go build -trimpath -ldflags "-s -w" -o "${STAGE_DIR}/nodexactl${{ matrix.ext }}" ./cmd/nodexactl

          if [ "${{ matrix.os }}" = "windows" ]; then
            (cd "${STAGE_DIR}" && zip -r "../nodex-supervisor_${{ matrix.os }}_${DISPLAY_ARCH}.zip" .)
            tar -czf "nodex-supervisor_${{ matrix.os }}_${DISPLAY_ARCH}.tar.gz" -C "${STAGE_DIR}" .
          else
            tar -czf "nodex-supervisor_${{ matrix.os }}_${DISPLAY_ARCH}.tar.gz" -C "${STAGE_DIR}" .
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}-${{ matrix.display_arch || matrix.arch }}
          path: nodex-supervisor_*.*

  publish:
    name: Publish GitHub Release
    needs: [check-release, build]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum nodex-supervisor_* > checksums.txt

      - name: Create Git Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: Release ${{ needs.check-release.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Uploads every build to the admin dashboard's supervisor builds, where
  # devices are offered updates from. A host is matched to a device type by
  # what it registers with: Linux builds go under third_party-<arch> (the
  # IDs the dashboard already uses), macOS and Windows under
  # third_party-<os>-<arch>, so each host is only offered its own OS's
  # build. <arch> is runtime.GOARCH, which devices report as architecture.
  publish-dashboard:
    name: Publish to admin dashboard
    needs: [check-release, publish]
    runs-on: ubuntu-latest
    env:
      DASHBOARD_API: https://nodexa.elzora.tech/accounts/api/v1
      VERSION: ${{ needs.check-release.outputs.version }}
      TAG: ${{ needs.check-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release builds
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Write release notes
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          {
            echo "nodex-supervisor ${VERSION} for third-party hosts (Docker, nerdctl or runc)"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since ${PREV_TAG}:"
              git log --no-merges --max-count=40 --format='- %s (%h)' "${PREV_TAG}..${GITHUB_SHA}"
            else
              echo "Initial release."
            fi
            echo ""
            echo "Commit: ${GITHUB_SHA::7}"
          } > release-notes.txt
          cat release-notes.txt

      - name: Sign in to dashboard
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_USERNAME" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "ADMIN_USERNAME / ADMIN_PASSWORD secrets are not set."
            exit 1
          fi
          # Session cookie login, same as the dashboard itself.
          jq -n --arg email "$ADMIN_USERNAME" --arg password "$ADMIN_PASSWORD" \
            '{email: $email, password: $password}' > "$RUNNER_TEMP/signin.json"
          STATUS=$(curl -sS -o signin-response.json -w '%{http_code}' -c "$RUNNER_TEMP/dashboard-cookies" \
            -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/signin.json" \
            "$DASHBOARD_API/auth/signin")
          rm -f "$RUNNER_TEMP/signin.json"
          if [ "$STATUS" != "200" ]; then
            echo "Sign-in failed (HTTP $STATUS): $(cat signin-response.json)"
            exit 1
          fi

      - name: Upload builds
        run: |
          JAR="$RUNNER_TEMP/dashboard-cookies"
          {
            echo "## Dashboard: nodex-supervisor ${VERSION}"
            echo ""
            echo "| Device type | Architecture | File | Result |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # <release file os>/<release file arch> <GOARCH>
          for target in darwin/amd64:amd64 darwin/arm64:arm64 linux/amd64:amd64 linux/arm64:arm64 \
                        linux/armv7:arm windows/amd64:amd64 windows/arm64:arm64; do
            OS="${target%%/*}"
            REST="${target#*/}"
            FILE_ARCH="${REST%%:*}"
            GOARCH="${REST#*:}"
            FILE="nodex-supervisor_${OS}_${FILE_ARCH}.tar.gz"
            if [ "$OS" = "linux" ]; then
              DEVICE_TYPE="third_party-${GOARCH}"
            else
              DEVICE_TYPE="third_party-${OS}-${GOARCH}"
            fi

            BIN="nodex-supervisor"
            [ "$OS" = "windows" ] && BIN="nodex-supervisor.exe"
            if ! tar -tzf "dist/${FILE}" "./${BIN}" >/dev/null; then
              echo "ERROR: dist/${FILE} has no ${BIN}"
              exit 1
            fi
            SHA256="$(sha256sum "dist/${FILE}" | cut -d' ' -f1)"

            STATUS=$(curl -sS -o upload-response.json -w '%{http_code}' -b "$JAR" \
              --max-time 600 \
              -F "device_type=${DEVICE_TYPE}" \
              -F "version=${VERSION}" \
              -F "architecture=${GOARCH}" \
              -F "checksum=${SHA256}" \
              -F "description=<release-notes.txt" \
              -F "file=@dist/${FILE};filename=${FILE};type=application/octet-stream" \
              "$DASHBOARD_API/supervisor-images")
            case "$STATUS" in
              201) RESULT="uploaded" ;;
              409) RESULT="already on dashboard, skipped" ;;
              *)
                echo "Upload of ${FILE} as ${DEVICE_TYPE} failed (HTTP $STATUS): $(cat upload-response.json)"
                exit 1
                ;;
            esac
            echo "${DEVICE_TYPE} ${VERSION}: ${RESULT}"
            echo "| \`${DEVICE_TYPE}\` | ${GOARCH} | \`${FILE}\` | ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Sign out of dashboard
        if: always()
        run: |
          JAR="$RUNNER_TEMP/dashboard-cookies"
          if [ -f "$JAR" ]; then
            curl -sS -o /dev/null -b "$JAR" -X POST "$DASHBOARD_API/auth/signout" || true
            rm -f "$JAR"
          fi
